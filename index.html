<!DOCTYPE html>
<html lang="en" ng-app="nexusERP" ng-cloak>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusCorp ERP Portal</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#002d85">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NexusCorp ERP">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'background':              '#f9f9ff',
            'primary':                 '#002d85',
            'primary-container':       '#0041b6',
            'primary-fixed':           '#dbe1ff',
            'on-tertiary-container':   '#60cec1',
            'tertiary-fixed':          '#89f5e7',
            'error':                   '#ba1a1a',
            'on-surface':              '#191c23',
            'on-surface-variant':      '#434652',
            'surface-container-lowest':'#ffffff',
            'surface-container':       '#e7eeff',
            'surface-container-high':  '#dee8ff',
            'inverse-surface':         '#263143',
            'outline-variant':         '#c3c6d4'
          },
          fontFamily: {
            headline: ['Manrope', 'sans-serif'],
            body:     ['Inter',   'sans-serif'],
            label:    ['Inter',   'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Chart.js & PapaParse -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

  <!-- AngularJS 1.8 + ngRoute -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js"></script>

  <!-- App -->
  <link rel="stylesheet" href="css/app.css">
  <script src="app.js"></script>

  <!-- Services -->
  <script src="services/csv.service.js"></script>
  <script src="services/finance.service.js"></script>
  <script src="services/sales.service.js"></script>
  <script src="services/crm.service.js"></script>
  <script src="services/production.service.js"></script>
  <script src="services/supplychain.service.js"></script>

  <!-- Component Controllers -->
  <script src="components/overview/overview.controller.js"></script>
  <script src="components/finance/finance.controller.js"></script>
  <script src="components/sales/sales.controller.js"></script>
  <script src="components/crm/crm.controller.js"></script>
  <script src="components/production/production.controller.js"></script>
  <script src="components/supplychain/supplychain.controller.js"></script>
</head>

<body class="font-body bg-background text-on-surface flex" ng-controller="AppCtrl">

  <!-- ═══════════════════════════════ SIDEBAR ═══════════════════════════════ -->
  <aside class="h-screen w-64 fixed left-0 top-0 bg-[#263143] flex flex-col py-6 z-50">
    <div class="px-5 mb-8">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-400 to-indigo-600 flex items-center justify-center">
          <span class="material-symbols-outlined text-white" style="font-size:18px">hub</span>
        </div>
        <div>
          <div class="text-white font-headline font-bold text-sm leading-tight">NexusCorp</div>
          <div class="text-slate-400 text-[10px]">ERP Portal</div>
        </div>
      </div>
    </div>

    <nav class="flex-1 space-y-0.5 px-3">
      <a href="#/overview"
         ng-class="isActive('/overview') ? 'bg-blue-700 text-white' : 'text-slate-400 hover:bg-slate-700/50'"
         class="flex items-center gap-3 px-4 py-2.5 rounded-full transition-colors text-sm font-medium">
        <span class="material-symbols-outlined" style="font-size:20px">dashboard</span>Portal Overview
      </a>
      <a href="#/finance"
         ng-class="isActive('/finance') ? 'bg-blue-700 text-white' : 'text-slate-400 hover:bg-slate-700/50'"
         class="flex items-center gap-3 px-4 py-2.5 rounded-full transition-colors text-sm font-medium">
        <span class="material-symbols-outlined" style="font-size:20px">account_balance</span>Finance
      </a>
      <a href="#/sales"
         ng-class="isActive('/sales') ? 'bg-blue-700 text-white' : 'text-slate-400 hover:bg-slate-700/50'"
         class="flex items-center gap-3 px-4 py-2.5 rounded-full transition-colors text-sm font-medium">
        <span class="material-symbols-outlined" style="font-size:20px">trending_up</span>Sales
      </a>
      <a href="#/crm"
         ng-class="isActive('/crm') ? 'bg-blue-700 text-white' : 'text-slate-400 hover:bg-slate-700/50'"
         class="flex items-center gap-3 px-4 py-2.5 rounded-full transition-colors text-sm font-medium">
        <span class="material-symbols-outlined" style="font-size:20px">people</span>Customer Relations
      </a>
      <a href="#/production"
         ng-class="isActive('/production') ? 'bg-blue-700 text-white' : 'text-slate-400 hover:bg-slate-700/50'"
         class="flex items-center gap-3 px-4 py-2.5 rounded-full transition-colors text-sm font-medium">
        <span class="material-symbols-outlined" style="font-size:20px">precision_manufacturing</span>Production
      </a>
      <a href="#/supplychain"
         ng-class="isActive('/supplychain') ? 'bg-blue-700 text-white' : 'text-slate-400 hover:bg-slate-700/50'"
         class="flex items-center gap-3 px-4 py-2.5 rounded-full transition-colors text-sm font-medium">
        <span class="material-symbols-outlined" style="font-size:20px">local_shipping</span>Supply Chain
      </a>
    </nav>

    <div class="px-3 mt-4 space-y-2">
      <div class="flex items-center gap-3 px-4 py-2.5 rounded-full text-slate-400 hover:bg-slate-700/50 transition-colors text-sm cursor-pointer">
        <span class="material-symbols-outlined" style="font-size:20px">help_outline</span>Support
      </div>
      <button class="w-full flex items-center justify-center gap-2 py-2.5 rounded-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white text-sm font-medium hover:opacity-90 transition-opacity">
        <span class="material-symbols-outlined" style="font-size:18px">download</span>Export Report
      </button>
    </div>
  </aside>

  <!-- ═══════════════════════════════ MAIN ═══════════════════════════════ -->
  <main id="main-content" class="flex-1 ml-64 min-w-0">
    <div ng-view></div>
  </main>

  <!-- FAB -->
  <button class="fixed bottom-6 right-6 w-14 h-14 rounded-full bg-gradient-to-br from-blue-600 to-indigo-700 text-white shadow-lg flex items-center justify-center hover:scale-105 transition-transform z-50">
    <span class="material-symbols-outlined">add</span>
  </button>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js')
          .then(function (reg) { console.log('[SW] Registered:', reg.scope); })
          .catch(function (err) { console.warn('[SW] Registration failed:', err); });
      });
    }
  </script>
</body>
</html>
